[package]
name = "psi_insar_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
approx = "0.5.1"
chrono = { version = "0.4.41", features = ["serde"] }
gdal = { version = "0.18.0", features = ["array", "ndarray"] }
gdal-sys = "0.11.0"
nalgebra = "0.33.2"
ndarray = { version = "0.16.1", features = ["rayon"] }
num-complex = "0.4.6"
num-traits = "0.2.19"
quick-xml = { version = "0.37.2", features = ["serde", "serialize"] }
rayon = "1.10.0"
rustfft = "6.2.0"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
serde_path_to_error = "0.1.17"
spade = "2.13.1"
thiserror = "2.0.11"
ureq = "3.0.11"

[dev-dependencies]
rerun = { version = "0.23.2", default-features = false, features = ["sdk"] }
rand = "0.9.1"
