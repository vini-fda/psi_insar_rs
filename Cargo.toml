[package]
name = "psi_insar_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "= 0.4.39", features = ["serde"] }
gdal = { version = "0.18.0", features = ["array", "ndarray"] }
gdal-sys = "0.11.0"
nalgebra = "0.33.2"
ndarray = "0.16.1"
num-complex = "0.4.6"
quick-xml = { version = "0.37.2", features = ["serde", "serialize"] }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
serde_path_to_error = "0.1.17"
thiserror = "2.0.11"

[dev-dependencies]
rerun = { version = "0.22.1", default-features = false, features = ["sdk"] }
