[package]
name = "psi_insar_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.40", features = ["serde"] }
futures-util = "0.3.31"
indicatif = "0.17.11"
ndarray = "0.16.1"
num-complex = "0.4.6"
reqwest = { version = "0.12.12", features = ["json", "stream"] }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
thiserror = "2.0.11"
tokio = { version = "1.43.0", features = ["macros"] }
url = "2.5.4"
