[package]
name = "psi_insar_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
approx = "0.5.1"
base64 = "0.22.1"
geotiff = { git = "https://github.com/vini-fda/geotiff", features = [
    "tie-points",
] }
chrono = { version = "0.4.41", features = ["serde"] }
dirs = "7.0.0"
env_logger = "0.11.8"
log = "0.4.27"
nalgebra = "0.33.2"
ndarray = { version = "0.16.1", features = ["rayon"] }
ndarray-npy = "0.9.1"
num-complex = "0.4.6"
num-traits = "0.2.19"
quick-xml = { version = "0.37.2", features = ["serde", "serialize"] }
rayon = "1.10.0"
rustfft = "6.2.0"
thread_local = "1.1.8"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
serde_path_to_error = "0.1.17"
spade = "2.13.1"
thiserror = "2.0.11"
ureq = { version = "3.0.11", features = ["cookies", "json"] }
url = "2.5.2"
zip-extract = "0.3.0"

[dev-dependencies]
rerun = { version = "0.38.1", default-features = false, features = ["sdk"] }
rand = "0.9.1"
zip = { version = "3.0.0", default-features = false }
