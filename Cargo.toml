[package]
name = "psi_insar_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
approx = "0.5.1"
base64 = "0.23.1"
geotiff = { git = "https://github.com/vini-fda/geotiff", features = [
    "tie-points",
] }
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
env_logger = "0.11.11"
log = "0.4.34"
nalgebra = "0.35.0"
ndarray = { version = "0.16.1", features = ["rayon"] }
ndarray-npy = "0.9.1"
num-complex = "0.4.6"
num-traits = "0.2.19"
quick-xml = { version = "0.42.0", features = ["serde", "serialize"] }
rayon = "1.12.0"
rustfft = "6.4.1"
thread_local = "1.1.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
spade = "2.15.1"
thiserror = "2.0.21"
ureq = { version = "3.4.2", features = ["cookies", "json"] }
url = "2.5.8"
zip = { version = "8.6.0", default-features = false, features = [
    "deflate-flate2-zlib-rs",
] }

[dev-dependencies]
rerun = { version = "0.38.1", default-features = false, features = ["sdk"] }
rand = "0.10.3"
